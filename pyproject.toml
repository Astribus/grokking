[project]
name = "grokking"
version = "0.1.0"
description = "Train a tiny transformer on modular addition, watch it grok, and reverse-engineer the algorithm it learns."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "torch>=2.15.0",
]

[project.scripts]
grokking = "grokking:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
